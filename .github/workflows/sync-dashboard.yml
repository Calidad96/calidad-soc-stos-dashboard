name: Sync dashboard data

# Reliable full sync — runs on GitHub (up to 2 hours), not Vercel (60s limit).
on:
  schedule:
    # 13:00 UTC ≈ 6:00 AM US Pacific (PDT)
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: calidad-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full dashboard sync
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: npm run sync
