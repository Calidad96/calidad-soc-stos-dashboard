name: Resume automatic sync

on:
  schedule:
    # Every 10 minutes — picks up 5/10/15/30 min retry windows without manual action
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  resume-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resume due sync job
        env:
          APP_URL: ${{ secrets.SYNC_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "SYNC_APP_URL secret not set — skip"
            exit 0
          fi
          curl -sf -X POST "$APP_URL/api/sync/resume" || true

      - name: Run sync worker burst
        env:
          APP_URL: ${{ secrets.SYNC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_APP_URL or CRON_SECRET not set — skip worker"
            exit 0
          fi
          curl -sf -X POST "$APP_URL/api/sync/worker" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}' || true
